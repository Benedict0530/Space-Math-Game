<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | MathSpaceGame</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="landscape-overlay" style="display:none;position:fixed;z-index:9999;top:0;left:0;width:100vw;height:100vh;align-items:center;justify-content:center;background:#231F20;color:white;font-size:2em;text-align:center;">
      Please rotate your device to landscape mode to play the game.
    </div>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=1080 height=720 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/OttodotBuild.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/OttodotBuild.data.unityweb",
        frameworkUrl: buildUrl + "/OttodotBuild.framework.js.unityweb",
        codeUrl: buildUrl + "/OttodotBuild.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "MathSpaceGame",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      // Responsive: add viewport meta if not present
      if (!document.querySelector('meta[name="viewport"]')) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      // Responsive resizing for all devices
      function resizeUnityCanvas() {
        var container = document.getElementById('unity-container');
        var w = window.innerWidth;
        var h = window.innerHeight;
        container.style.width = w + 'px';
        container.style.height = h + 'px';
        canvas.width = w;
        canvas.height = h;
        canvas.style.width = '100vw';
        canvas.style.height = '100vh';
      }
      window.addEventListener('resize', resizeUnityCanvas);
      resizeUnityCanvas();

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";

          // Robust auto fullscreen on any click/touch (desktop & mobile)
          function isFullscreen() {
            return document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
          }

          let fullscreenCooldown = false;
          function requestFullscreen() {
            if (fullscreenCooldown) return;
            var elem = document.documentElement;
            if (!isFullscreen()) {
              fullscreenCooldown = true;
              setTimeout(() => { fullscreenCooldown = false; }, 1000); // 1s cooldown
              let fullscreenPromise = null;
              if (elem.requestFullscreen) {
                fullscreenPromise = elem.requestFullscreen();
              } else if (elem.mozRequestFullScreen) { /* Firefox */
                fullscreenPromise = elem.mozRequestFullScreen();
              } else if (elem.webkitRequestFullscreen) { /* Chrome, Safari & Opera */
                fullscreenPromise = elem.webkitRequestFullscreen();
              } else if (elem.msRequestFullscreen) { /* IE/Edge */
                fullscreenPromise = elem.msRequestFullscreen();
              }
              // Try to lock orientation to landscape (works only in fullscreen and on some browsers)
              if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(function(e) {
                  // Ignore errors silently
                });
              }
              // Only call SetFullscreen(1) after fullscreen is granted
              if (fullscreenPromise && typeof fullscreenPromise.then === 'function') {
                fullscreenPromise.then(function() {
                  unityInstance.SetFullscreen(1);
                }).catch(function() {
                  // Ignore errors
                });
              } else {
                // Fallback for browsers that don't return a promise
                setTimeout(function() { unityInstance.SetFullscreen(1); }, 100);
              }
            }
          }

          // Listen for fullscreen change and update Unity fullscreen state
          function onFullscreenChange() {
            if (!isFullscreen()) {
              // Exited fullscreen, update Unity
              unityInstance.SetFullscreen(0);
            } else {
              // Entered fullscreen, update Unity
              unityInstance.SetFullscreen(1);
            }
          }
          document.addEventListener('fullscreenchange', onFullscreenChange);
          document.addEventListener('webkitfullscreenchange', onFullscreenChange);
          document.addEventListener('mozfullscreenchange', onFullscreenChange);
          document.addEventListener('MSFullscreenChange', onFullscreenChange);

          document.body.addEventListener('click', requestFullscreen);
          document.body.addEventListener('touchend', requestFullscreen);

        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);

    </script>
  </body>
</html>
